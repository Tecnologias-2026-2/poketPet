<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
    <title>Registrarse - PocketPet</title>
</head>
<body>

    <div class="pantalla">
        <div class="lado-izquierdo">
            <div class="mancha mancha5"></div>
            <div class="mancha mancha6"></div>
            <img class="logo-grande" src="assets/mascotalogo.png" alt="PocketPet">
            <span class="etiqueta-hola">¡Hola!</span>
            <div class="lema"><b>AHORRA HOY,</b><br>CONSTRUYE TU MAÑANA</div>
        </div>
        <div class="lado-derecho">
            <div class="mancha mancha1"></div>
            <div class="mancha mancha2"></div>
            <div class="mancha mancha3"></div>
            <div class="mancha mancha4"></div>
            <form class="formulario" data-destino="login.html">
                <h2>Crea tu cuenta</h2>
                <p class="subtitulo">Completa tus datos para comenzar</p>
                <label for="nombre">Nombre completo<span style="color:red">*</span></label>
                <input type="text" id="nombre" placeholder="nombre completo" required>
                <label for="correo">Correo electrónico<span style="color:red">*</span></label>
                <input type="email" id="correo" placeholder="ingresar correo" required>
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" placeholder="crear contraseña" required>
                <label for="clave2">Confirmar contraseña</label>
                <input type="password" id="clave2" placeholder="contraseña" required>
                <button class="boton-amarillo" type="submit">Crear Cuenta</button>
                <p class="enlace-pequeno">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a><br><br><a href="landingpage.html">Anterior</a></p>
            </form>
        </div>
    </div>

    <div class="cargando">
        <div class="puntos">
            <div class="punto punto1"></div>
            <div class="punto punto2"></div>
            <div class="punto punto3"></div>
            <div class="punto punto4"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
